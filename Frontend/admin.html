<!doctype html>
<html lang="es">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Administración de tanques - Admin</title>
<link rel="stylesheet" href="css/styles.css"><link rel="stylesheet" href="css/admin.css">
</head>
<body>
<header class="topbar"><div><strong>Administración de tanques</strong><span id="userName"></span></div><button id="logoutButton" class="secondary">Cerrar sesión</button></header>
<main class="container">
<section class="page-heading"><div><h1>Dashboard</h1><p>Administración general.</p></div><div class="heading-actions"><button id="requestsButton">Solicitudes</button><button id="refreshButton" class="secondary">Actualizar</button></div></section>
<section id="stats" class="stats"></section>
<section class="panel">
<div class="panel-title"><h2>Usuarios</h2><button id="newUserButton">Nuevo usuario</button></div>
<div class="table-wrap"><table><thead><tr><th>ID</th><th>Nombre</th><th>Usuario</th><th>Rol</th><th>Acciones</th></tr></thead><tbody id="usersBody"></tbody></table></div>
</section>
<section class="panel">
<div class="panel-title"><h2>Tanques</h2><button id="newTankButton">Nuevo tanque</button></div>
<div class="table-wrap"><table><thead><tr><th>ID</th><th>Tipo</th><th>Cantidad actual</th><th>Capacidad total</th><th>Nivel</th><th>Altura</th><th>Ubicación</th><th>Usuarios</th><th>Acciones</th></tr></thead><tbody id="tanksBody"></tbody></table></div>
</section>
<div id="modal" class="modal hidden"><div class="modal-card"><button id="closeModal" class="modal-close">×</button><h2 id="modalTitle"></h2><form id="modalForm"></form></div></div>
<div id="adminError" class="alert error hidden"></div>
</main>
<script src="js/api.js"></script><script src="js/auth.js"></script><script src="js/admin.js"></script>
</body>
</html>
